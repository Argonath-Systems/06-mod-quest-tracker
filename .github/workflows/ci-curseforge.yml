name: CI & CurseForge Publish

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*-release'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  MAVEN_OPTS: '-Xmx2g -XX:+UseG1GC'
  CURSEFORGE_PROJECT_ID: 'TBD'  # To be filled after creating CurseForge project

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Checkout parent POM
        uses: actions/checkout@v4
        with:
          repository: Argonath-Systems/01-platform-core
          path: platform-core
          token: ${{ secrets.GH_PAT }}
      
      - name: Install parent POM
        run: |
          cd platform-core
          mvn install -N -B
      
      - name: Build with Maven
        run: mvn clean package -B -V
      
      - name: Run tests
        run: mvn test -B
      
      - name: Find mod JAR
        id: find-jar
        run: |
          MOD_JAR=$(find target -name "quest-tracker-ui-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -1)
          MOD_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "mod_jar=$MOD_JAR" >> $GITHUB_OUTPUT
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "Found JAR: $MOD_JAR"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quest-tracker-mod
          path: ${{ steps.find-jar.outputs.mod_jar }}

  publish-curseforge:
    name: Publish to CurseForge
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-release')
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quest-tracker-mod
      
      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          project_id: ${{ env.CURSEFORGE_PROJECT_ID }}
          game_endpoint: hytale
          file_path: quest-tracker-ui-*.jar
          changelog: |
            See full changelog at: https://github.com/Argonath-Systems/06-mod-quest-tracker/releases/tag/${{ github.ref_name }}
          release_type: release
          game_versions: |
            Hytale Alpha 1.0
          display_name: Quest Tracker UI ${{ github.ref_name }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quest-tracker-mod
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: quest-tracker-ui-*.jar
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
