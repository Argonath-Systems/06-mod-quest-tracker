# Default Quest Tracker UI Configuration
tracker:
  # Position & Layout
  position:
    anchor: TOP_RIGHT # TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT, CENTER
    offset_x: -20
    offset_y: 50

  size:
    width: 280
    max_height: 400
    scale: 1.0

  # Display Settings
  display:
    max_pinned_quests: 3
    max_visible_objectives: 8
    show_completed_objectives: true
    completed_fade_seconds: 3
    show_progress_bars: true
    show_progress_text: true
    show_distance: true
    show_timer: true

  # Collapse Behavior
  collapse:
    enabled: true
    default_collapsed: false
    collapse_completed: true
    collapse_during_combat: false

  # Animations
  animations:
    enabled: true
    objective_complete_flash: true
    progress_update_pulse: true
    new_quest_slide_in: true
    duration_ms: 300

# Theme Selection
theme: dark-fantasy
custom_themes_folder: themes/

# Notification Settings
notifications:
  enabled: true
  position: TOP_CENTER
  quest_accepted: true
  quest_completed: true
  objective_completed: true
  timer_warnings: [ 300, 60, 30 ] # seconds
  sounds: true

# Waypoint Settings
waypoints:
  enabled: true
  show_compass: true
  show_world_markers: true
  show_distance: true
  max_render_distance: 1000
  fade_start_distance: 800

# Performance
performance:
  update_rate_ms: 100
  batch_updates: true
  lazy_render: true

# Accessibility
accessibility:
  high_contrast_mode: false
  colorblind_mode: none # none, deuteranopia, protanopia, tritanopia
  screen_reader_support: false
  text_scale: 1.0
