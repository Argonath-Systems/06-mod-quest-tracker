# Quest Tracker UI Configuration
# Reference: specs/28-quest-tracker-ui.md

tracker:
  position:
    anchor: TOP_RIGHT
    offset_x: -20
    offset_y: 50
    locked: false

  layout:
    width: 280
    row_height: 24
    font_size: 14
    font_family: "Hytale_Serif"

  display:
    max_pinned_quests: 3
    show_progress_bars: true
    show_distance: true
    show_timer: true
    show_completed_objectives: true
    
  filtering:
    auto_pin_new: true
    auto_unpin_completed: true
    priority_sorting: ["MAIN_STORY", "TIMED", "SIDE", "DISTANCE"]

  collapse:
    enabled: true
    default_collapsed: false
    collapse_completed: true
    collapse_during_combat: false

  immersive_mode:
    enabled: true
    hide_in_combat: false
    hide_in_dialogue: true
    hide_on_mount: false
    opacity_idle: 0.8
    opacity_active: 1.0

  indicators:
    world_markers:
      enabled: true
      show_distance: true
      max_distance: 2000
      clamp_to_screen_edge: true
    compass_bar:
      show_quest_icons: true
    minimap_integration: true

  accessibility:
    colorblind_mode: "tritanopia"
    text_scaling: 1.0
    high_contrast_background: false
    screen_reader_support: false
